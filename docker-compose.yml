name: ${COMPOSE_PROJECT_NAME:-dental-legal-ai}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dental_legal}
      POSTGRES_USER: ${POSTGRES_USER:-dental_legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and replace the password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks: [backend]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dental_legal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and replace the password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - minio-data:/data
    networks: [backend]
    restart: unless-stopped

  legal-core:
    build:
      context: .
      dockerfile: services/legal_core/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dental_legal}
      POSTGRES_USER: ${POSTGRES_USER:-dental_legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_HOST: minio
      MINIO_PORT: 9000
      BOOTSTRAP_TELEGRAM_ADMIN_ID: ${BOOTSTRAP_TELEGRAM_ADMIN_ID:-}
      BOOTSTRAP_CLINIC_NAME: ${BOOTSTRAP_CLINIC_NAME:-Моя стоматология}
      PLATFORM_OWNER_TELEGRAM_ID: ${PLATFORM_OWNER_TELEGRAM_ID:-}
      LEGAL_EMBEDDING_BASE_URL: ${LEGAL_EMBEDDING_BASE_URL:-}
      LEGAL_EMBEDDING_API_KEY: ${LEGAL_EMBEDDING_API_KEY:-}
      LEGAL_EMBEDDING_MODEL: ${LEGAL_EMBEDDING_MODEL:-}
      LEGAL_EMBEDDING_MODEL_KEY: ${LEGAL_EMBEDDING_MODEL_KEY:-}
      LEGAL_EMBEDDING_DIMENSIONS: ${LEGAL_EMBEDDING_DIMENSIONS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:${LEGAL_CORE_PORT:-8000}:8000"
    networks: [backend, edge]
    restart: unless-stopped

  agent-orchestrator:
    profiles: [analysis]
    build:
      context: .
      dockerfile: services/agent_orchestrator/Dockerfile
    environment:
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      LEGAL_CORE_URL: http://legal-core:8000
      HERMES_RESEARCHER_URL: ${HERMES_RESEARCHER_URL:-}
      HERMES_RESEARCHER_API_KEY: ${HERMES_RESEARCHER_API_KEY:-}
      HERMES_RESEARCHER_MODEL: ${HERMES_RESEARCHER_MODEL:-researcher}
      HERMES_REVIEWER_URL: ${HERMES_REVIEWER_URL:-}
      HERMES_REVIEWER_API_KEY: ${HERMES_REVIEWER_API_KEY:-}
      HERMES_REVIEWER_MODEL: ${HERMES_REVIEWER_MODEL:-reviewer}
    depends_on:
      legal-core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend, edge]
    restart: unless-stopped

  legal-watcher:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: services/legal_core/watcher.Dockerfile
    environment:
      LEGAL_WATCH_INTERVAL_SECONDS: ${LEGAL_WATCH_INTERVAL_SECONDS:-21600}
    command:
      - sh
      - -c
      - >-
        set -eu;
        while :; do
          watch_to=$$(date -u +%F);
          watch_from=$$(date -u -d '1 day ago' +%F);
          python -m legal_core.legal_watcher
          --rules /app/services/legal_core/corpus/legal_watch_rules.v1.json
          --inbox /var/lib/dental-legal-ai/legal-update-inbox
          --publication-from $$watch_from
          --publication-to $$watch_to;
          sleep "$$LEGAL_WATCH_INTERVAL_SECONDS";
        done
    read_only: true
    volumes:
      - legal-watch-inbox:/var/lib/dental-legal-ai/legal-update-inbox
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [edge]
    restart: unless-stopped

  telegram-gateway:
    build:
      context: .
      dockerfile: services/gateway/telegram/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      LEGAL_CORE_URL: http://legal-core:8000
      AGENT_ORCHESTRATOR_URL: ${AGENT_ORCHESTRATOR_URL:-}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; raise SystemExit(0 if Path('/tmp/telegram-gateway-ready').is_file() else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      legal-core:
        condition: service_healthy
    networks: [backend, edge]
    restart: unless-stopped
    stop_grace_period: 20s

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  legal-watch-inbox:
