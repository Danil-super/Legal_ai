[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-legal-ai"
version = "0.1.0"
description = "Evidence-grounded legal assistant core for dental clinics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "python-telegram-bot>=22.8,<23",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["services/legal_core/src", "services/gateway/telegram/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["services/legal_core/tests", "services/gateway/telegram/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"services/gateway/telegram/src/telegram_gateway/ui.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["legal_core", "telegram_gateway"]
mypy_path = "services/legal_core/src:services/gateway/telegram/src"
