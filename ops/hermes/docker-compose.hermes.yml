services:
  legal-core:
    environment:
      # The durable analysis worker uses the same internal orchestrator as the gateway.
      AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:8010
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:?Set AGENT_INTERNAL_KEY}

  hermes-researcher:
    profiles: [analysis]
    image: dental-legal-hermes:5fc308a70719a83cccdbba4c0e39c23f5a8239d5
    pull_policy: never
    user: "10000:10000"
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        /opt/hermes/.venv/bin/python /opt/legal/render_profile.py
        /opt/legal/legal-profile.config.yaml /opt/data/config.yaml &&
        /opt/hermes/.venv/bin/python /opt/legal/assert_tool_free.py &&
        exec /opt/hermes/.venv/bin/hermes gateway run --no-supervise
    environment:
      HERMES_HOME: /opt/data
      PYTHONPATH: /opt/hermes
      HERMES_MODEL: ${HERMES_RESEARCHER_LLM_MODEL:?Set HERMES_RESEARCHER_LLM_MODEL}
      OPENAI_BASE_URL: ${HERMES_LLM_BASE_URL:?Set HERMES_LLM_BASE_URL}
      OPENAI_API_KEY: ${HERMES_LLM_API_KEY:?Set HERMES_LLM_API_KEY}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_RESEARCHER_API_KEY:?Set HERMES_RESEARCHER_API_KEY}
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent http://127.0.0.1:8642/health >/dev/null"
      interval: 10s
      timeout: 3s
      retries: 9
      start_period: 20s
    volumes:
      - hermes-researcher-data:/opt/data
      - ./ops/hermes/legal-profile.config.yaml:/opt/legal/legal-profile.config.yaml:ro
      - ./ops/hermes/render_profile.py:/opt/legal/render_profile.py:ro
      - ./ops/hermes/assert_tool_free.py:/opt/legal/assert_tool_free.py:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend, edge]
    restart: unless-stopped

  hermes-reviewer:
    profiles: [analysis]
    image: dental-legal-hermes:5fc308a70719a83cccdbba4c0e39c23f5a8239d5
    pull_policy: never
    user: "10000:10000"
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        /opt/hermes/.venv/bin/python /opt/legal/render_profile.py
        /opt/legal/legal-profile.config.yaml /opt/data/config.yaml &&
        /opt/hermes/.venv/bin/python /opt/legal/assert_tool_free.py &&
        exec /opt/hermes/.venv/bin/hermes gateway run --no-supervise
    environment:
      HERMES_HOME: /opt/data
      PYTHONPATH: /opt/hermes
      HERMES_MODEL: ${HERMES_REVIEWER_LLM_MODEL:?Set HERMES_REVIEWER_LLM_MODEL}
      OPENAI_BASE_URL: ${HERMES_LLM_BASE_URL:?Set HERMES_LLM_BASE_URL}
      OPENAI_API_KEY: ${HERMES_LLM_API_KEY:?Set HERMES_LLM_API_KEY}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_REVIEWER_API_KEY:?Set HERMES_REVIEWER_API_KEY}
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent http://127.0.0.1:8642/health >/dev/null"
      interval: 10s
      timeout: 3s
      retries: 9
      start_period: 20s
    volumes:
      - hermes-reviewer-data:/opt/data
      - ./ops/hermes/legal-profile.config.yaml:/opt/legal/legal-profile.config.yaml:ro
      - ./ops/hermes/render_profile.py:/opt/legal/render_profile.py:ro
      - ./ops/hermes/assert_tool_free.py:/opt/legal/assert_tool_free.py:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend, edge]
    restart: unless-stopped

  agent-orchestrator:
    environment:
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:?Set AGENT_INTERNAL_KEY}
      HERMES_RESEARCHER_URL: http://hermes-researcher:8642
      HERMES_RESEARCHER_API_KEY: ${HERMES_RESEARCHER_API_KEY:?Set HERMES_RESEARCHER_API_KEY}
      HERMES_RESEARCHER_MODEL: hermes-agent
      HERMES_REVIEWER_URL: http://hermes-reviewer:8642
      HERMES_REVIEWER_API_KEY: ${HERMES_REVIEWER_API_KEY:?Set HERMES_REVIEWER_API_KEY}
      HERMES_REVIEWER_MODEL: hermes-agent
    depends_on:
      legal-core:
        condition: service_healthy
      hermes-researcher:
        condition: service_healthy
      hermes-reviewer:
        condition: service_healthy

  telegram-gateway:
    environment:
      AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:8010
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:?Set AGENT_INTERNAL_KEY}
    depends_on:
      agent-orchestrator:
        condition: service_healthy

volumes:
  hermes-researcher-data:
  hermes-reviewer-data:
