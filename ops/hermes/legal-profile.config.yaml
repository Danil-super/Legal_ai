# Tool-free Hermes API-server baseline for Dental Legal AI.
# The provider route is explicit to prevent Hermes from treating an OpenAI-compatible
# credential as an OpenRouter credential. Concrete values are resolved from the
# deployment environment; neither endpoint credential nor model choice is committed.
#
# IMPORTANT: this file is accepted only together with ops/hermes/assert_tool_free.py.
# The preflight resolves Hermes' actual builtin/plugin registries and aborts startup
# if any model tool schema survives this configuration.

model:
  provider: custom
  default: ${HERMES_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}

platform_toolsets:
  api_server: []

mcp_servers: {}

memory:
  memory_enabled: false
  user_profile_enabled: false

compression:
  enabled: false

checkpoints:
  enabled: false

smart_model_routing:
  enabled: false

session_reset:
  mode: none

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    idempotent_no_progress: 3
