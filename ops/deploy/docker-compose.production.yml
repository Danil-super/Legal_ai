services:
  postgres:
    mem_limit: 384m

  redis:
    mem_limit: 128m

  minio:
    mem_limit: 256m

  legal-core:
    mem_limit: 512m
    environment:
      AGENT_ORCHESTRATOR_URL: ""
      AGENT_INTERNAL_KEY: ""

  telegram-gateway:
    mem_limit: 192m
    environment:
      # Direct TLS egress is the normal production route.  The gateway code still
      # supports an explicitly configured proxy if a future deployment needs one.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      # The analysis overlay sets the internal URL only in the enabled deployment mode.
      AGENT_ORCHESTRATOR_URL: ""
      AGENT_INTERNAL_KEY: ""

  # The watcher can reach only the official publication portal through `edge`.
  # Its paired importer has a read-only inbox and only the private backend network.
  # Both paths create REVIEW_REQUIRED candidates; neither can approve legal text.
  legal-watcher:
    profiles: !reset []
    mem_limit: 128m
    environment:
      LEGAL_WATCH_PROXY_URL: ${LEGAL_WATCH_PROXY_URL:-}

  legal-watch-importer:
    profiles: !reset []
    mem_limit: 128m
