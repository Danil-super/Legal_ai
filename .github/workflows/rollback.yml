name: Rollback production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA that is reachable from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: dental-legal-ai-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Checkout pinned deployment host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Request explicit rollback
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          ssh-add - <<<"$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 ops/deploy/known_hosts.production "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=no \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            deploy@84.201.153.147 "rollback $DEPLOY_REVISION"
