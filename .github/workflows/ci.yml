name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]' --no-deps

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: >-
          python -m mypy
          services/legal_core/src
          services/gateway/telegram/src
          services/agent_orchestrator/src

      - name: Unit tests
        run: python -m pytest

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
        run: docker compose config --quiet

      - name: Validate pinned Hermes overlay
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
          AGENT_INTERNAL_KEY: ci-only-agent-internal-key-12345678901234567890
          HERMES_LLM_BASE_URL: https://llm.example.invalid/v1
          HERMES_LLM_API_KEY: ci-only-provider-key
          HERMES_RESEARCHER_LLM_MODEL: synthetic-researcher-model
          HERMES_REVIEWER_LLM_MODEL: synthetic-reviewer-model
          HERMES_RESEARCHER_API_KEY: ci-only-researcher-server-key
          HERMES_REVIEWER_API_KEY: ci-only-reviewer-server-key
        run: >-
          docker compose
          -f docker-compose.yml
          -f ops/hermes/docker-compose.hermes.yml
          --profile analysis
          config --quiet

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: dental_legal_test_ci
          POSTGRES_USER: dental_legal
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_legal -d dental_legal_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: dental_legal_test_ci
      POSTGRES_USER: dental_legal
      POSTGRES_PASSWORD: integration-only-password
      POSTGRES_APP_USER: dental_legal_app
      POSTGRES_APP_PASSWORD: integration-runtime-password-12345678901234567890
      POSTGRES_INTEGRATION: '1'
      MINIO_HOST: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: clinic-storage-ci
      MINIO_SECRET_KEY: integration-minio-password-12345678901234567890
      MINIO_BUCKET: clinic-documents-ci
      MINIO_SECURE: '0'
      MINIO_REGION: us-east-1
      MINIO_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]' --no-deps

      - name: Start MinIO integration service
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio-ci
          exit 1

      - name: Provision runtime database role
        run: python -m legal_core.runtime_db_role

      - name: Apply migrations
        run: alembic upgrade head

      - name: Refresh runtime database grants
        run: python -m legal_core.runtime_db_role

      - name: PostgreSQL and MinIO integration tests
        run: timeout 120s python -m pytest -vv services/legal_core/tests
