name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.7'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]' --no-deps

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check .

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: >-
          python -m mypy
          services/legal_core/src
          services/gateway/telegram/src
          services/agent_orchestrator/src

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m pytest

      - name: Verify checked-in official legal PDFs
        id: official_pdfs
        continue-on-error: true
        run: |
          python -m legal_core.official_fetch --manifest services/legal_core/corpus/official/pp736-a7de08b6176991ed.json --verify-only
          python -m legal_core.official_fetch --manifest services/legal_core/corpus/official/pp659-7af320a12723f96f.json --verify-only

      - name: Dependency vulnerability audit
        id: dependency_audit
        continue-on-error: true
        run: python -m pip_audit --strict -r requirements.lock

      - name: Validate Compose
        id: compose
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
        run: docker compose config --quiet

      - name: Validate production Compose overlay
        id: production_compose
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
        run: >-
          docker compose
          -f docker-compose.yml
          -f ops/deploy/docker-compose.production.yml
          config --quiet

      - name: Verify production legal watcher isolation
        id: production_legal_watcher
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
        run: |
          set -euo pipefail
          docker compose \
            -f docker-compose.yml \
            -f ops/deploy/docker-compose.production.yml \
            config --format json | jq -e '
              .services as $services |
              (($services["legal-watcher"] | has("profiles") | not) and
               ($services["legal-watcher"].networks | keys == ["edge"]) and
               ($services["legal-watch-importer"] | has("profiles") | not) and
               ($services["legal-watch-importer"].networks | keys == ["backend"]) and
               ($services["legal-watch-importer"].read_only == true) and
               ($services | has("agent-orchestrator") | not))'

      - name: Validate pinned Hermes overlay
        id: hermes_compose
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
          AGENT_INTERNAL_KEY: ci-only-agent-internal-key-12345678901234567890
          HERMES_LLM_BASE_URL: https://llm.example.invalid/v1
          HERMES_LLM_API_KEY: ci-only-provider-key
          HERMES_RESEARCHER_LLM_MODEL: synthetic-researcher-model
          HERMES_REVIEWER_LLM_MODEL: synthetic-reviewer-model
          HERMES_RESEARCHER_API_KEY: ci-only-researcher-server-key
          HERMES_REVIEWER_API_KEY: ci-only-reviewer-server-key
        run: >-
          docker compose
          -f docker-compose.yml
          -f ops/hermes/docker-compose.hermes.yml
          --profile analysis
          config --quiet

      - name: Validate production analysis overlays together
        id: production_analysis_compose
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_APP_PASSWORD: ci-only-runtime-database-password-1234567890
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          TELEGRAM_BOT_TOKEN: 123456:ci_config_validation_token_1234567890
          AGENT_INTERNAL_KEY: ci-only-agent-internal-key-12345678901234567890
          HERMES_LLM_BASE_URL: https://llm.example.invalid/v1
          HERMES_LLM_API_KEY: ci-only-provider-key
          HERMES_RESEARCHER_LLM_MODEL: synthetic-researcher-model
          HERMES_REVIEWER_LLM_MODEL: synthetic-reviewer-model
          HERMES_RESEARCHER_API_KEY: ci-only-researcher-server-key-12345678901234567890
          HERMES_REVIEWER_API_KEY: ci-only-reviewer-server-key-12345678901234567890
        run: |
          set -euo pipefail
          docker compose \
            -f docker-compose.yml \
            -f ops/deploy/docker-compose.production.yml \
            -f ops/hermes/docker-compose.hermes.yml \
            --profile analysis config --format json | jq -e '
              .services as $s |
              ($s["telegram-gateway"].environment.AGENT_ORCHESTRATOR_URL == "http://agent-orchestrator:8010") and
              ($s["legal-core"].environment.AGENT_ORCHESTRATOR_URL == "http://agent-orchestrator:8010") and
              ($s["telegram-gateway"].networks | keys == ["backend"]) and
              ($s["agent-orchestrator"].networks | keys == ["backend"]) and
              ($s["telegram-gateway"].depends_on["agent-orchestrator"].condition == "service_healthy") and
              ($s["hermes-researcher"].pull_policy == "never") and
              ($s["hermes-reviewer"].pull_policy == "never") and
              ($s["legal-watcher"] | has("profiles") | not) and
              ($s["legal-watch-importer"] | has("profiles") | not)'

      - name: Enforce quality gate
        if: always()
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          OFFICIAL_PDFS_OUTCOME: ${{ steps.official_pdfs.outcome }}
          DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          COMPOSE_OUTCOME: ${{ steps.compose.outcome }}
          PRODUCTION_COMPOSE_OUTCOME: ${{ steps.production_compose.outcome }}
          PRODUCTION_LEGAL_WATCHER_OUTCOME: ${{ steps.production_legal_watcher.outcome }}
          HERMES_COMPOSE_OUTCOME: ${{ steps.hermes_compose.outcome }}
          PRODUCTION_ANALYSIS_COMPOSE_OUTCOME: ${{ steps.production_analysis_compose.outcome }}
        run: |
          set -euo pipefail
          test "$RUFF_OUTCOME" = success
          test "$MYPY_OUTCOME" = success
          test "$UNIT_TESTS_OUTCOME" = success
          test "$OFFICIAL_PDFS_OUTCOME" = success
          test "$DEPENDENCY_AUDIT_OUTCOME" = success
          test "$COMPOSE_OUTCOME" = success
          test "$PRODUCTION_COMPOSE_OUTCOME" = success
          test "$PRODUCTION_LEGAL_WATCHER_OUTCOME" = success
          test "$HERMES_COMPOSE_OUTCOME" = success
          test "$PRODUCTION_ANALYSIS_COMPOSE_OUTCOME" = success

  postgres-integration:
    runs-on: ubuntu-latest
    # The first build compiles the pinned MinIO security release from source.
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: dental_legal_test_ci
          POSTGRES_USER: dental_legal
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_legal -d dental_legal_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: dental_legal_test_ci
      POSTGRES_USER: dental_legal
      POSTGRES_PASSWORD: integration-only-password
      POSTGRES_APP_USER: dental_legal_app
      POSTGRES_APP_PASSWORD: integration-runtime-password-12345678901234567890
      POSTGRES_INTEGRATION: '1'
      MINIO_HOST: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: clinic-storage-ci
      MINIO_SECRET_KEY: integration-minio-password-12345678901234567890
      MINIO_BUCKET: clinic-documents-ci
      MINIO_SECURE: '0'
      MINIO_REGION: us-east-1
      MINIO_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.7'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]' --no-deps

      - name: Build fixed MinIO from pinned upstream source
        run: >-
          docker build --file ops/minio/Dockerfile
          --tag dental-legal-minio:9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a .

      - name: Start MinIO integration service
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            dental-legal-minio:9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio-ci
          exit 1

      - name: Provision runtime database role
        run: python -m legal_core.runtime_db_role

      - name: Apply migrations
        run: alembic upgrade head

      - name: Refresh runtime database grants
        run: python -m legal_core.runtime_db_role

      - name: PostgreSQL and MinIO integration tests
        run: timeout 120s python -m pytest -vv services/legal_core/tests

  codeql:
    name: CodeQL
    # Private personal repositories cannot upload code-scanning results unless GitHub Code
    # Security is enabled. Dependency vulnerability scanning remains mandatory in `quality`.
    # Enable this guarded job only after the repository has that service: CODEQL_ENABLED=true.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:python

  deploy-production:
    name: Deploy production
    needs: [quality, postgres-integration, codeql]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      needs.postgres-integration.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout pinned deployment host key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy verified main revision
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          ssh-add - <<<"$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 ops/deploy/known_hosts.production "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=no deploy@84.201.153.147 "deploy $DEPLOY_SHA"
